name: daily_news
description: "Business news intelligence app built with Flutter, Riverpod and Hive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.3
  crypto: ^3.0.7
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#123C69"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
